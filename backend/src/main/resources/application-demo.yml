# Zero-install local profile. PostgreSQL remains the production/default deployment target.
spring:
  datasource:
    url: jdbc:h2:file:../.data/earthpulse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
