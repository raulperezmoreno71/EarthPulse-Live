spring:
  application:
    name: earthpulse-api
  profiles:
    default: demo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

earthpulse:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  sync:
    usgs-delay-ms: ${USGS_SYNC_DELAY_MS:60000}
    eonet-delay-ms: ${EONET_SYNC_DELAY_MS:600000}
  feeds:
    usgs-url: ${USGS_URL:https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson}
    eonet-url: ${EONET_URL:https://eonet.gsfc.nasa.gov/api/v3/events/geojson?status=open&limit=500&days=90}
