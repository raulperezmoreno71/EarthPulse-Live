services:
  postgres:
    image: postgres:17-alpine
    container_name: earthpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: earthpulse
      POSTGRES_USER: ${DATABASE_USER:-earthpulse}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-earthpulse}
    ports:
      - "5432:5432"
    volumes:
      - earthpulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  earthpulse-postgres:
